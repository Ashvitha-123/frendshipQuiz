<!DOCTYPE html>
<html>

<head>
    <title>Friendship Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->

    <div class="container" id="startScreen">

        <h1>🎭</h1>

        <p>
            <b>Ashvitha</b> is testing
            <br>
            her <i>real</i> friends 👀
        </p>

        <p>
            Will you pass?
            <br>
            Let's see 👇
        </p>

        <button onclick="startQuiz()">
            FIND OUT 😈
        </button>

        <button onclick="showCreator()">
            ✨ CREATE YOUR OWN QUIZ
        </button>

    </div>


    <!-- QUIZ SCREEN -->

    <div class="container" id="quizScreen">

        <p id="questionNumber">
            Question 1 of 6
        </p>

        <h2 id="question"></h2>

        <div id="options"></div>

    </div>


    <!-- RESULT SCREEN -->

    <div class="container" id="resultScreen">

        <h1>🏆</h1>

        <h2 id="resultTitle"></h2>

        <p id="resultMessage"></p>

        <button onclick="restartQuiz()">
            TRY AGAIN 🔄
        </button>

        <button onclick="showCreator()">
            ✨ CREATE YOUR OWN QUIZ
        </button>

    </div>


    <!-- CREATE QUIZ SCREEN -->

    <div class="container" id="creatorScreen">

        <h1>✨</h1>

        <h2>Create Your Own Quiz</h2>

        <p id="creatorProgress">
            Question 1 of 6
        </p>


        <!-- CREATOR NAME -->

        <input
            type="text"
            id="creatorName"
            placeholder="Your name"
        >


        <!-- QUESTION -->

        <input
            type="text"
            id="creatorQuestion"
            placeholder="Enter your question"
        >


        <!-- OPTIONS -->

        <input
            type="text"
            id="option0"
            placeholder="Option A"
        >

        <input
            type="text"
            id="option1"
            placeholder="Option B"
        >

        <input
            type="text"
            id="option2"
            placeholder="Option C"
        >

        <input
            type="text"
            id="option3"
            placeholder="Option D"
        >


        <!-- CORRECT ANSWER -->

        <p>
            ☑️ Tick the correct answer
        </p>

        <div class="correct-answer">

            <label>
                <input
                    type="radio"
                    name="correctAnswer"
                    value="0"
                    checked
                >
                Option A
            </label>

            <label>
                <input
                    type="radio"
                    name="correctAnswer"
                    value="1"
                >
                Option B
            </label>

            <label>
                <input
                    type="radio"
                    name="correctAnswer"
                    value="2"
                >
                Option C
            </label>

            <label>
                <input
                    type="radio"
                    name="correctAnswer"
                    value="3"
                >
                Option D
            </label>

        </div>


        <!-- BUTTONS -->

        <button onclick="addCreatorQuestion()">
            ADD QUESTION ➕
        </button>

        <button onclick="cancelCreator()">
            CANCEL ❌
        </button>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
